info:
  name: List Staff Attendances
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/donations/:donationId/war-slots/:slotId/attendances?page=1&limit=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "20"
      type: query
    - name: slotId
      value: "1"
      type: path
    - name: donationId
      value: 00000000-0000-0000-0000-000000002002
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: 200 OK
    request:
      url: "{{base_url}}/donations/1f7f017a-70d2-42d1-8657-19563041b95b/war-slots/104/attendances"
