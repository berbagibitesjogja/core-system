info:
  name: Configure War Slots
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/donations/:donationId/war-slots"
  params:
    - name: donationId
      value: 00000000-0000-0000-0000-000000002002
      type: path
  body:
    type: json
    data: |-
      [
        {
          "division_id": 1,
          "quota": 2
        },
        {
          "division_id": 3,
          "quota": 3
        }
      ]

      // [
      //   {
      //     "division_id": int
      //     "quota": int
      //   },{}
      // ]
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

