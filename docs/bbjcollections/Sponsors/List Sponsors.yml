info:
  name: List Sponsors
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/sponsors?page=1&limit=10&variant=&search=&hidden="
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: variant
      value: ""
      type: query
    - name: search
      value: ""
      type: query
    - name: hidden
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 Public (Public & Hero)"
    request:
      url: "{{base_url}}/sponsors?page=1&limit=10&variant=&search="
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
        - name: variant
          value: ""
          type: query
        - name: search
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
          value: application/json; charset=utf-8
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Sponsors retrieved successfully",
            "data": [
              {
                "id": "87acbb21-a5b2-4d99-8511-48cb43253df7",
