info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "it@berbagibitesjogja.com",
        "password": "password"
      }
      // {
      //   "email": max 255
      //   "password": unlimited
      // }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Token successfully stored!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
