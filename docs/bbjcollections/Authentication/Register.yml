info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/register"
  body:
    type: json
    data: |-
      {
        "invitation_token": "{{inviteToken}}",
        "password": "password",
        "name": "Budi Bakso",
        "phone_number": "6280000000000"
      }

      // {
      //   "invitation_token": unlimited
      //   "password": min 8, max 72
      //   "name": max 255
      //   "phone_number": max 20
      // }
  auth: inherit

runtime:
  variables:
    - name: inviteToken
      value: 0cd7ef63fa363a415b4f5adda681309e02627e36fae0fc2e7388ce53732dce77
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Registered and tokens stored successfully!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
