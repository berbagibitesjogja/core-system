info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/auth/register"
  body:
    type: json
    data: |-
      {
        "invitation_token": "b9e87ca6adb2e0d2c24b93752b7555b57caf50c79ced45ead12cabda4a08c7e0",
        "password": "password",
        "name": "Budi Bakso",
        "phone_number": "6280000000000"
      }
      // {
      //   "invitation_token": unlimited
      //   "password": unlimited
      //   "name": string, max 255
      //   "phone_number": max 20
      // }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Registered and tokens stored successfully!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
