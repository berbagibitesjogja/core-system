info:
  name: Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refreshToken}}"
      }
      // {
      //   "refresh_token": unlimited
      // }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Tokens rotated and stored successfully!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200"
    request:
      url: "{{base_url}}/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh_token": "{{refreshToken}}"
          }
          // {
          //   "refresh_token": unlimited
          // }
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-headers
          value: Content-Type, Authorization, X-Requested-With, Accept, Origin
        - name: access-control-allow-methods
          value: GET, POST, PUT, PATCH, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-expose-headers
          value: Content-Length, Content-Type
        - name: access-control-max-age
          value: "86400"
        - name: content-type
          value: application/json; charset=utf-8
        - name: referrer-policy
          value: strict-origin-when-cross-origin
        - name: x-content-type-options
          value: nosniff
        - name: x-frame-options
          value: DENY
        - name: x-request-id
          value: ref_4b5f1868
        - name: x-xss-protection
          value: 1; mode=block
        - name: date
          value: Wed, 11 Nov 2026 01:57:56 GMT
        - name: content-length
          value: "576"
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Token refreshed successfully",
            "data": {
              "access_token": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..JIDXKGw4mKuV0gyLLGRyo-ajXH0V-AjZ-EB3s-DnPAw",
              "refresh_token": "275947ed9e287f052c606f2bfe6c2d714985c0adda304018302ee25e5646529c",
              "expires_in": 900
            }
          }
