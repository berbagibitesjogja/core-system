info:
  name: Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/auth/refresh"
  body:
    type: json
    data: |-
      {
        "refresh_token": "{{refreshToken}}"
      }
      // {
      //   "refresh_token": unlimited
      // }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Tokens rotated and stored successfully!");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200"
    request:
      url: "{{base_url}}/auth/refresh"
      method: POST
      body:
        type: json
        data: |-
          {
            "refresh_token": "{{refreshToken}}"
          }
          // {
          //   "refresh_token": unlimited
          // }
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-headers
