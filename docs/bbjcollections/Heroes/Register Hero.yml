info:
  name: Register Hero
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/heroes/register"
  body:
    type: json
    data: |-
      {
        "email": "hero@mail.ugm.ac.id",
        "password": "password123",
        "name": "Budi Hero",
        "phone_number": "6281234567890"
      }
      // {
      //   "email": max 255
      //   "password": min 8, max 72
      //   "name": max 255
      //   "phone_number": max 20
      // }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "201"
    request:
      url: "{{base_url}}/heroes/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "hero@mail.ugm.ac.id",
            "password": "password123",
            "name": "Budi Hero",
            "phone_number": "6281234567890"
          }
          // {
          //   "email": max 255
          //   "password": min 8, max 72
          //   "name": max 255
          //   "phone_number": max 20
          // }
    response:
      status: 201
      statusText: Created
      headers:
        - name: access-control-allow-headers
          value: Content-Type, Authorization, X-Requested-With, Accept, Origin
        - name: access-control-allow-methods
          value: GET, POST, PUT, PATCH, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-expose-headers
          value: Content-Length, Content-Type
        - name: access-control-max-age
          value: "86400"
        - name: content-type
          value: application/json; charset=utf-8
        - name: referrer-policy
          value: strict-origin-when-cross-origin
        - name: x-content-type-options
          value: nosniff
        - name: x-frame-options
          value: DENY
        - name: x-request-id
          value: ref_6df17659
        - name: x-xss-protection
          value: 1; mode=block
        - name: date
          value: Wed, 11 Nov 2026 02:00:49 GMT
        - name: content-length
          value: "162"
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Registration successful. Please verify your email.",
            "data": {
              "email": "hero@mail.ugm.ac.id",
              "is_verified": false,
              "name": "Budi Hero"
            }
          }
