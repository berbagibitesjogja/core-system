info:
  name: Resend Verification
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/heroes/resend-verification"
  body:
    type: json
    data: |-
      {
        "email": "hero@mail.ugm.ac.id"
      }
      // {
      //   "email": max 255
      // }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

