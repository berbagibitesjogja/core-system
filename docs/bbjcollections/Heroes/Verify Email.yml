info:
  name: Verify Email
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/heroes/verify-email"
  body:
    type: json
    data: |-
      {
        "email": "hero@mail.ugm.ac.id",
        "code": "{{emailCode}}"
      }
      // {
      //   "email": max 255
      //   "code": 6 digits
      // }
  auth: inherit

runtime:
  variables:
    - name: emailCode
      value: "927396"
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Email verified! Tokens stored successfully.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
