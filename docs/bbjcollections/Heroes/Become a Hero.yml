info:
  name: Become a Hero
  type: http
  seq: 5

http:
  method: POST
  url: "{{base_url}}/heroes/me"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Became a hero! Updated tokens stored.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200"
    request:
      url: "{{base_url}}/heroes/me"
      method: POST
    response:
      status: 200
      statusText: OK
      headers:
        - name: access-control-allow-headers
          value: Content-Type, Authorization, X-Requested-With, Accept, Origin
        - name: access-control-allow-methods
          value: GET, POST, PUT, PATCH, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-expose-headers
          value: Content-Length, Content-Type
        - name: access-control-max-age
          value: "86400"
        - name: content-type
          value: application/json; charset=utf-8
        - name: referrer-policy
