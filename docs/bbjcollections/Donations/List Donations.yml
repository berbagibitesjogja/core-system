info:
  name: List Donations
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/donations?page=1&limit=10&status=&search="
  params:
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "10"
      type: query
    - name: status
      value: ""
      type: query
    - name: search
      value: ""
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "200 Public (Hero / Public)"
    request:
      url: "{{base_url}}/donations?page=1&limit=10&status=open&search="
      method: GET
      params:
        - name: page
          value: "1"
          type: query
        - name: limit
          value: "10"
          type: query
        - name: status
          value: "open"
          type: query
        - name: search
          value: ""
          type: query
    response:
      status: 200
      statusText: OK
      headers:
        - name: content-type
