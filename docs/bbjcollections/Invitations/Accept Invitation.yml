info:
  name: Accept Invitation
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/invitations/accept"
  body:
    type: json
    data: |-
      {
        "token": "3865cc719871ef8da8bb16e32f7907e1dc514e574c904deeb80b6c0fdb43b332"
      }
      // {
      //   "token": unlimited
      // }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody();

        if (body && body.data) {
          const token = body.data.access_token;
          const refresh = body.data.refresh_token;

          if (token) {
            bru.setVar("accessToken", token);
            try {
              bru.setEnvVar("accessToken", token);
            } catch (e) {}
          }

          if (refresh) {
            bru.setVar("refreshToken", refresh);
            try {
              bru.setEnvVar("refreshToken", refresh);
            } catch (e) {}
          }

          console.log("Invitation accepted! Staff tokens stored.");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

