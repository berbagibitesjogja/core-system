info:
  name: Create Reimbursement
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/reimbursements"
  body:
    type: json
    data: |-
      {
        "amount": 1000,
        "method": "Bank Plecit",
        "target": "000001",
        "notes": "Beli ini itu",
        "file_ids": []
      }
      // {
      //   "amount": int
      //   "method": max 50
      //   "target": max 100
      //   "notes"?: unlimited
      //   "file_ids"?: uuid[]
      // }
