info:
  name: Create Food Item
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/food-items"
  body:
    type: json
    data: |-
      {
        "name": "Ayam Pop"
      }
      // {
      //   "name": max 100
      // }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

examples:
  - name: "201"
    request:
      url: "{{base_url}}/food-items"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "Ayam Pop"
          }
          // {
          //   "name": max 100
          // }
    response:
      status: 201
      statusText: Created
      headers:
        - name: access-control-allow-headers
          value: Content-Type, Authorization, X-Requested-With, Accept, Origin
        - name: access-control-allow-methods
          value: GET, POST, PUT, PATCH, DELETE, OPTIONS
        - name: access-control-allow-origin
          value: "*"
        - name: access-control-expose-headers
          value: Content-Length, Content-Type
        - name: access-control-max-age
          value: "86400"
        - name: content-type
          value: application/json; charset=utf-8
        - name: referrer-policy
          value: strict-origin-when-cross-origin
        - name: x-content-type-options
          value: nosniff
        - name: x-frame-options
          value: DENY
        - name: x-request-id
          value: ref_abf99220
        - name: x-xss-protection
          value: 1; mode=block
        - name: date
          value: Fri, 06 Nov 2026 18:13:00 GMT
        - name: content-length
          value: "182"
      body:
        type: json
        data: |-
          {
            "status": "success",
            "message": "Food item created successfully",
            "data": {
              "id": 385,
              "name": "Ayam Pop",
              "created_at": "2026-11-07T01:13:00+07:00",
              "updated_at": "2026-11-07T01:13:00+07:00"
            }
          }
